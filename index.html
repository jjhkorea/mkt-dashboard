<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>제로아이즈 마케팅 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f6f7fb; --card:#fff; --ink:#1a1d29; --dim:#6b7280; --line:#e8eaf0;
  --nsa:#12b76a; --gda:#3b82f6; --car:#f97316; --nat:#94a3b8; --etc:#cbd5e1;
  --blog:#a78bfa; --cafe:#22d3ee; --viral:#f472b6;
  --pri:#6d28d9; --up:#10b981; --dn:#ef4444; --warn:#f59e0b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:13px;line-height:1.5}
.wrap{max-width:1560px;margin:0 auto;padding:18px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--dim);font-size:12px}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.fresh{display:flex;gap:8px;flex-wrap:wrap}
.fresh div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px}
.fresh b{display:block;font-size:12px;color:var(--ink)}
.fresh .old{color:var(--dn);font-weight:700}

.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:8px 16px;font-size:13px;cursor:pointer;color:var(--dim);font-weight:600}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.seg{display:inline-flex;gap:4px;background:#eef0f6;border-radius:999px;padding:3px;margin-bottom:10px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 13px;font-size:12px;
  cursor:pointer;color:var(--dim);font-weight:600}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .lb{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.kpi .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:4px 0 2px}
.kpi .d{font-size:11px;color:var(--dim)}
.up{color:var(--up);font-weight:700}.dn{color:var(--dn);font-weight:700}.neu{color:var(--dim)}
/* 증감은 실수치보다 작게 — 주장이 세지 않도록 */
.dt{font-size:10px;font-weight:600;opacity:.8;margin-left:3px}
/* 오래된 주차 컬럼은 흐리게 */
td.wold{color:#aab0be}
th.wold{color:#c2c7d2}
tr.wold td{color:#aab0be}
tr.wold td:first-child{color:#8c93a3}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 2px;font-size:14px}
.card .note{color:var(--dim);font-size:11px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:620px}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:11px;background:#fafbfd;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
tr.tot{background:#f8f6ff;font-weight:700}
tr.grp{background:#f4f6fb;font-weight:700}
tr.lav{background:#f3efff}
tr.lav td:first-child{font-weight:600;color:#6d28d9}
tbody tr:hover{background:#fafbfd}
.pill{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10px;font-weight:700}
.p-n{background:#e7f8ef;color:#0f9c5b}.p-g{background:#e8f0fe;color:#2563eb}.p-c{background:#fff0e6;color:#ea580c}
.muted{color:#c3c8d4}
.rt{color:#dadee8;font-weight:400}
.dnw{color:#f0a9a9;font-weight:400}
.old2{color:#aeb4c2;font-weight:400}
.sub2{display:block;font-size:10px;color:#b6bcc8;letter-spacing:-.2px;margin-top:1px;font-weight:400}

.bizgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.bizbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bizbox .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bizbox .hd b{font-size:13px}.bizbox .hd span{font-size:11px;color:var(--dim)}
.camp{position:relative;transition:.12s}
.camp:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.07)}
.camp.top{border-width:2px}
.cmeta{display:flex;gap:11px;font-size:11px;color:var(--dim);flex-wrap:wrap;margin-top:2px}
.cmeta b{color:var(--ink)}

.gacards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.gac{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.gac .t{font-size:13px;font-weight:700;margin-bottom:8px}
.gac .row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;color:var(--dim)}
.gac .row b{color:var(--ink);font-size:12px}
.krow{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--dim)}
.krow b{color:var(--ink);font-size:12px;font-weight:700}

.load{text-align:center;padding:70px 20px;color:var(--dim)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--pri);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fff4f4;border:1px solid #ffd5d5;color:#b91c1c;border-radius:10px;padding:16px;line-height:1.7}
.hint{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 13px;font-size:12px;margin-bottom:14px}
canvas{max-height:100%}
</style>
</head>

  [/매장찾기/,'매장찾기'],[/탁구장 제품소개서/,'탁구장 제품소개서'],[/제품소개서/,'제품소개서'],
  [/무인탁구장 키오스크 프로모션/,'탁구장 프로모션'],
  [/스터디카페 키오스크 교체|스터디카페 교체 프로모션|^250819$/,'스카 프로모션'],
  [/ARS/,'ARS'],[/빠른상담/,'빠른상담'],[/쉐어애드/,'쉐어애드'],[/안정성/,'안정성 대응백서'],
  [/배리어프리|베리어프리/,'배리어프리'],[/QR PASS|qr-pass/,'QR PASS'],[/연습장|^golf$/,'골프연습장'],
  [/피트니스/,'피트니스'],[/공간예약/,'공간예약'],[/탁구장/,'탁구장'],[/스터디카페/,'스터디카페'],
  [/든든한 파트너|파트너$|^ZeroEyes$|^store$/,'메인']
];
const toCard = p => { p = String(p); for (const [re,v] of CARD_RULES) if (re.test(p)) return v; return '기타'; };
const GA_MAIN = ['탁구장','스터디카페','메인','제품소개서','QR PASS','골프연습장','배리어프리','공간예약','피트니스'];

/* ═══════════════════════════════════════════════════════════
   집계
   ═══════════════════════════════════════════════════════════ */
const D = {};
function build(T){
  /* T6 → 캠페인 매핑 */
  CMAP = {};
  for (const r of T.T6) if (r[1]) CMAP[r[1]] = r[4] || '미분류';

  /* T1 상담인입 — 2026 (1/5 = serial 46027) 이후 */
  const t1 = T.T1.filter(r => r[0] && +r[0] >= 46027);
  const W = [...new Set(t1.map(r => +r[0]))].sort((a,b)=>a-b);
  const wi = Object.fromEntries(W.map((w,i)=>[w,i])), n = W.length, z = () => Array(n).fill(0);
  D.W = W; D.n = n;
  const C = D.C = { tot:z(), o7:z(), hy:z(), ha:z(), ch:{}, fm:{}, bz:{}, bzCh:{}, bzWk:{} };
  for (const r of t1){
    const i = wi[+r[0]], ch = r[1], bz = r[2], fm = r[3];
    const c = N(r[4]), o = N(r[5]), y = N(r[6]), a = N(r[7]);
    C.tot[i]+=c; C.o7[i]+=o; C.hy[i]+=y; C.ha[i]+=a;
    (C.ch[ch] = C.ch[ch]||z())[i]+=c;
    (C.fm[fm] = C.fm[fm]||z())[i]+=c;
    (C.bz[bz] = C.bz[bz]||z())[i]+=c;
    C.bzCh[bz] = C.bzCh[bz]||{}; (C.bzCh[bz][ch] = C.bzCh[bz][ch]||z())[i]+=c;
    C.bzWk[bz] = C.bzWk[bz]||{}; const e = C.bzWk[bz][+r[0]] = C.bzWk[bz][+r[0]]||{t:0,o:0,y:0,a:0,ch:{}};
    e.t+=c; e.o+=o; e.y+=y; e.a+=a; e.ch[ch] = (e.ch[ch]||0)+c;
  }
  /* 광고인입 = 네이버+구글+당근 (공식블로그·카페·체험단은 비광고) */
  D.adCv = z(); D.natCv = z();
  AD_CH.forEach(c => (C.ch[c]||z()).forEach((v,i) => D.adCv[i]+=v));
  D.natCv = (C.ch['자연']||z()).slice();

  /* T2 광고 */
  const A = D.A = { ch:{}, bizCost:{}, camp:{} };
  for (const r of T.T2){
    const w = +r[0], i = wi[w]; if (i === undefined) continue;
    const m = r[1], cp = r[3], im = N(r[4]), ck = N(r[5]), co = N(r[6]);
    A.ch[m] = A.ch[m] || {cost:z(), clk:z(), imp:z()};
    A.ch[m].cost[i]+=co; A.ch[m].clk[i]+=ck; A.ch[m].imp[i]+=im;
    const bz = CMAP[cp] || '미분류';
    (A.bizCost[bz] = A.bizCost[bz]||z())[i]+=co;
    A.camp[w] = A.camp[w]||[]; A.camp[w].push({m, ty:r[2], cp, im, ck, co});
  }
  /* T3 키워드 */
  D.KW = {};
  for (const r of T.T3){ const w = +r[0]; if (!w) continue;
    (D.KW[w] = D.KW[w]||[]).push({m:r[1], ty:r[2], cp:r[3], kw:r[4], im:N(r[5]), ck:N(r[6]), co:N(r[7])}); }

  /* T4 GA */
  const G = D.G = { cards:{}, tot:{pv:z(), cv:z(), bw:z(), sw:z()} };
  for (const r of T.T4){ const i = wi[+r[0]]; if (i === undefined) continue;
    const cd = toCard(r[1]);
    const g = G.cards[cd] = G.cards[cd] || {pv:z(), cv:z(), bw:z(), sw:z()};
    g.pv[i]+=N(r[2]); g.cv[i]+=N(r[3]); g.bw[i]+=N(r[4]); g.sw[i]+=N(r[5]);
    G.tot.pv[i]+=N(r[2]); G.tot.cv[i]+=N(r[3]); G.tot.bw[i]+=N(r[4]); G.tot.sw[i]+=N(r[5]); }

  /* T5 일별 + 신선도 */
  const t5 = T.T5.filter(r => r[0]);
  const DD = [...new Set(t5.map(r=>+r[0]))].sort((a,b)=>a-b);
  const di = Object.fromEntries(DD.map((d,i)=>[d,i])), dz = () => Array(DD.length).fill(0);
  const Y = D.Y = { d:DD, tot:dz(), ch:{}, bz:{} };
  for (const r of t5){ const i = di[+r[0]];
    Y.tot[i]+=N(r[3]); (Y.ch[r[1]] = Y.ch[r[1]]||dz())[i]+=N(r[3]); (Y.bz[r[2]] = Y.bz[r[2]]||dz())[i]+=N(r[3]); }
  D.F = {};
  for (const r of T.T5) if (r[9] && r[9] !== '소스') D.F[r[9]] = { last:r[10], ago:r[11] };

  /* 마지막 마감주 = 뒤에서 2번째 (마지막은 진행중) */
  D.li = n - 2; D.pi = n - 3; D.cur = n - 1;
}

const CH = {};

function mk(id, cfg){
  const el = document.getElementById(id); if (!el) return;
  if (CH[id]) CH[id].destroy();
  CH[id] = new Chart(el, cfg);
}
const baseOpt = (stack, extra={}, lbl=null) => ({
  responsive:true, maintainAspectRatio:false,
  interaction:{mode:'index', intersect:false},
  plugins:{ legend:{ labels:{ boxWidth:9, boxHeight:9, font:{size:11}, usePointStyle:true } }, lbl,
    tooltip:{ callbacks:{ label: c => {
      const v = c.parsed.y, lb = c.dataset.label ? c.dataset.label + ': ' : '';
      if (v == null) return lb + '—';
      return lb + (Math.abs(v) >= 100 ? Math.round(v).toLocaleString()
                                      : (Math.round(v*10)/10).toLocaleString()); } } } },
  scales:{ x:{ stacked:stack, ticks:T10, grid:{display:false} },
           y:{ stacked:stack, ticks:T10, grid:GRD, beginAtZero:true }, ...extra }
});

function vConsult(){
  const {W, C, li, pi, n} = D, g = (a,i) => a && a[i] != null ? a[i] : 0;
  const qi = Math.max(0, li - 2);
  /* 카드 안에 3주 추이를 바로 넣는다 — 0.7·상담희망을 탭으로 바꿔 가며 볼 필요 없게 */
  /* 추이는 0도 그대로 0으로 적는다 — 빈칸(–)이면 '안 들어온 건지 0건인지' 구분이 안 된다 */
  const t3 = arr => arr ? [qi,pi,li].map(i => nf(g(arr,i))).join('<span class="muted"> → </span>') : null;
  const detail = (aArr, oArr) => {
    const a = t3(aArr), o = t3(oArr);
    if (!a && !o) return `<div class="krow"><span class="muted">상담희망·0.7↑ 집계 대기</span></div>`;
    return `<div class="krow"><span>상담희망</span><b>${a||'<span class="muted">–</span>'}</b></div>
            <div class="krow"><span>0.7이상</span><b>${o||'<span class="muted">–</span>'}</b></div>`;
  };
  const kpi = (lb,cur,prv,col,extra) => `<div class="kpi">
      <div class="lb">${col?`<i class="dot" style="background:${col}"></i>`:''}${lb}</div>
      <div class="v" ${col?`style="color:${col}"`:''}>${nf(cur)}건</div>
      <div class="d">전주 ${nf(prv)}건 ${dv(cur,prv)}</div>
      ${extra?`<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px;font-size:11px">${extra}</div>`:''}</div>`;
  const ska = C.bz['스카독서실']||[], tak = C.bz['탁구장']||[];
  const BW = (typeof BZW !== 'undefined') ? BZW : {};
  /* 채널 묶음별 0.7·상담희망 — 스냅샷에 들어오면 자동으로 채워진다 */
  const chAgg = (list, key) => (C[key] ? list.map(c => C[key][c]).filter(Boolean) : []);
  const sumA = arrs => arrs.length ? D.W.map((_,i) => arrs.reduce((s,a)=>s+(a[i]||0),0)) : null;
  const adHa = sumA(chAgg(AD_CH,'chHa')),  adO7 = sumA(chAgg(AD_CH,'chO7'));
  const ntHa = sumA(chAgg(['자연'],'chHa')), ntO7 = sumA(chAgg(['자연'],'chO7'));

  document.getElementById('body').innerHTML = `
  <div class="note" style="margin-bottom:10px">${md(W[qi])}주 → ${md(W[pi])}주 → <b>${md(W[li])}주</b> ·
    카드 아래 작은 줄이 그 세 주의 상담희망·0.7↑ 추이입니다</div>
  <div class="kpis">
    ${kpi(`${md(W[li])}주 전체`, g(C.tot,li), g(C.tot,pi), '#6d28d9', detail(C.ha, C.o7))}
    ${kpi('스카독서실', g(ska,li), g(ska,pi), '#12b76a', detail(BW['스카독서실']&&BW['스카독서실'].a, BW['스카독서실']&&BW['스카독서실'].o))}
    ${kpi('탁구장', g(tak,li), g(tak,pi), '#3b82f6', detail(BW['탁구장']&&BW['탁구장'].a, BW['탁구장']&&BW['탁구장'].o))}
    ${kpi('광고인입', g(D.adCv,li), g(D.adCv,pi), '#7c3aed', detail(adHa, adO7))}
    ${kpi('자연유입', g(D.natCv,li), g(D.natCv,pi), '#94a3b8', detail(ntHa, ntO7))}
  </div>

  <div class="card"><h3>주차별 상담인입 추이</h3>
    <div class="note">막대 = 전체 · 선 = 0.7이상 / 상담희망(네+빠른상담) · ${n}주</div>
    <div style="height:270px"><canvas id="c_trend"></canvas></div></div>

  <div class="grid2">
    <div class="card"><h3>광고인입 vs 자연인입 (채널별)</h3>
      <div class="note">공식블로그·네이버카페·체험단은 콘텐츠로 분리</div>
      <div style="height:260px"><canvas id="c_ch"></canvas></div></div>
    <div class="card"><h3>전환유형별 추이</h3>
      <div class="note">폼 종류별 인입</div>
      <div style="height:260px"><canvas id="c_fm"></canvas></div></div>
  </div>

  <div class="card"><h3>업종 × 채널별 상담인입</h3>
    <div class="note">${md(W[li])}주 · 괄호 안은 전주(${md(W[pi])}) 대비</div>
    <div class="tblwrap">${bizTable()}</div></div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div><h3>업종별 주차 추이</h3><div class="note">업종별 채널 구성 변화</div></div>
      <div class="seg" style="margin:0">${[['recent','최근 8주'],['all','전체 '+n+'주']]
        .map(([k,v])=>`<button class="${BIZ_RANGE===k?'on':''}" onclick="setBiz('${k}')">${v}</button>`).join('')}</div>
    </div>
    <div class="bizgrid" id="bizgrid"></div></div>`;

  const L = cutL();
  mk('c_trend', { type:'bar', data:{ labels:L, datasets:[
      {type:'bar', label:'전체', data:cutA(C.tot), backgroundColor:'rgba(109,40,217,.22)', borderRadius:3, order:3},
      {type:'line', label:'0.7이상', data:cutA(C.o7), borderColor:'#0f9c5b', backgroundColor:'#0f9c5b', tension:.35, pointRadius:2, yAxisID:'y1', order:1},
      {type:'line', label:'상담희망', data:cutA(C.ha), borderColor:'#f59e0b', backgroundColor:'#f59e0b', borderDash:[5,4], tension:.35, pointRadius:2, yAxisID:'y1', order:2}
    ]}, options: baseOpt(false, { y1:{ position:'right', ticks:T10, grid:{display:false}, beginAtZero:true } }, {bars:'total', lines:'edge'}), plugins:[LBL] });

  mk('c_ch', { type:'bar', data:{ labels:L, datasets: DISP_CH.filter(grpHas).map(k => ({
      label:k, data: cutA(grpSeries(k)), backgroundColor:CC[k]||'#ddd', borderRadius:2 })) },
    options: baseOpt(true, {}, {bars:'total'}), plugins:[LBL] });

  mk('c_fm', { type:'line', data:{ labels:L, datasets: Object.keys(C.fm).map((k,i) => ({
      label:k, data:cutA(C.fm[k]), borderColor:['#3b82f6','#12b76a','#f59e0b','#a78bfa'][i%4],
      backgroundColor:'transparent', tension:.35, pointRadius:2 })) },
    options: baseOpt(false, {}, {lines:'all'}), plugins:[LBL] });

  drawBiz();
}
function setCrit(c){ CRIT = c; vConsult(); }
function setBiz(r){ BIZ_RANGE = r; vConsult(); }

function bizTable(){
  const {W, C, li, pi} = D;
  const cols = DISP_CH;
  const names = BIZ9.filter(b => C.bzWk[b]);
  const cell = (cur, prv) => cur ? `${nf(cur)} ${cur!==prv ? dv(cur,prv) : ''}`
    : (prv ? `<span class="muted">–</span> ${dv(0,prv)}` : '<span class="muted">–</span>');
  const rowOf = b => { const e = (C.bzWk[b]||{})[W[li]] || {t:0,o:0,y:0,a:0,ch:{}},
                             p = (C.bzWk[b]||{})[W[pi]] || {t:0,o:0,y:0,a:0,ch:{}};
    return `<tr><td>${b}</td><td>${cell(e.t,p.t)}</td><td>${cell(e.o,p.o)}</td><td>${cell(e.y,p.y)}</td>
      ${cols.map(c => { const mg = c==='기타' ? ETC_MERGE : c==='콘텐츠' ? CONT_CH : [c];
        const v = mg.reduce((s,k)=>s+(e.ch[k]||0),0), q = mg.reduce((s,k)=>s+(p.ch[k]||0),0);
        return `<td>${cell(v,q)}</td>`; }).join('')}</tr>`; };
  const T = { t:C.tot[li], o:C.o7[li], y:C.hy[li] }, P = { t:C.tot[pi], o:C.o7[pi], y:C.hy[pi] };
  return `<table><thead><tr><th>업종</th><th>전체</th><th>0.7↑</th><th>상담희망</th>
      ${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
      <tr class="tot"><td>총합계</td><td>${cell(T.t,P.t)}</td><td>${cell(T.o,P.o)}</td><td>${cell(T.y,P.y)}</td>
      ${cols.map(c => { const mg = c==='기타' ? ETC_MERGE : c==='콘텐츠' ? CONT_CH : [c];
        return cell(mg.reduce((s,k)=>s+(D.C.ch[k]?D.C.ch[k][li]:0),0), mg.reduce((s,k)=>s+(D.C.ch[k]?D.C.ch[k][pi]:0),0)); }).map(x=>`<td>${x}</td>`).join('')}</tr>
      ${names.map(rowOf).join('')}</tbody></table>`;
}

function drawBiz(){
  const {W, C, n} = D;
  const st = BIZ_RANGE === 'recent' ? Math.max(0, D.li-7) : 0;
  const idx = W.map((_,i)=>i).slice(st, D.li+1);

  document.getElementById('bizgrid').innerHTML = names.map((b,i) => {
    const sum = idx.reduce((a,j)=>a+(C.bz[b][j]||0),0);

  names.forEach((b,i) => mk('bz'+i, { type:'bar',
    data:{ labels: idx.map(j=>md(W[j])), datasets: DISP_CH
      .filter(c => C.bzCh[b] && idx.some(j => grpBz(b,c,j)))

/* ── 2. 광고 ── */
/* ═══ 차트 수치 라벨 ═══
   options.plugins.lbl = { bars:'total'|'each'|null, lines:'all'|'edge'|null, fmt:'man'|null }
   · 점이 16개를 넘으면 전부 찍지 않고 '의미 있는 것'만 고른다
     (마지막 주 → 최고점 → 전주 대비 변동이 큰 순)
   · 그래도 겹치면 우선순위가 낮은 라벨을 버린다 */
const _isBar = (c, ds) => (ds.type || c.config.type) === 'bar';
const _fmtV = (v, fmt) => fmt === 'man'
  ? (Math.abs(v) >= 10000 ? Math.round(v/10000) + '만' : Math.round(v).toLocaleString())
  : String(Math.round(v));
/* 의미 있는 인덱스 고르기 */
function _pick(data, n){
  const out = new Map();                                  // idx → 우선순위
  let last = -1;
  for (let i = data.length-1; i >= 0; i--) if (data[i] != null && data[i] > 0){ last = i; break; }
  if (last >= 0) out.set(last, 100);
  let mx = -1, mi = -1;
  data.forEach((v,i) => { if (v != null && v > mx){ mx = v; mi = i; } });
  if (mi >= 0 && !out.has(mi)) out.set(mi, 90);
  /* 전주 대비 변동폭이 큰 지점 = 이슈가 있었던 주 */
  const jump = data.map((v,i) => i ? Math.abs((v||0) - (data[i-1]||0)) : 0);
  jump.map((v,i) => [v,i]).sort((a,b) => b[0]-a[0]).forEach(([v,i]) => {
    if (out.size >= n || v <= 0 || out.has(i)) return;
    out.set(i, 70 - out.size * 2); });
  return out;
}
const LBL = { id:'lbl', afterDatasetsDraw(c){
  const cfg = (c.options.plugins && c.options.plugins.lbl) || {};
  if (!cfg.bars && !cfg.lines) return;
  const ctx = c.ctx, n = c.data.labels.length, fmt = cfg.fmt, cand = [];
  const dense = n > 16;
  const bars = [], lines = [];
  c.data.datasets.forEach((ds,di) => { const m = c.getDatasetMeta(di); if (m.hidden) return;
    (_isBar(c, ds) ? bars : lines).push({ds, m}); });

  if (cfg.bars === 'total' && bars.length){
    const tot = Array(n).fill(0), top = Array(n).fill(1e9);
    bars.forEach(({ds,m}) => m.data.forEach((el,i) => {
      const v = +ds.data[i] || 0; tot[i] += v; if (v > 0) top[i] = Math.min(top[i], el.y); }));
    const sel = dense ? _pick(tot, 6) : null;
    tot.forEach((v,i) => { if (!v || top[i] > 1e8) return;
      if (sel && !sel.has(i)) return;
      const el = bars[0].m.data[i]; if (!el) return;
      const isLast = i === n-1;
      cand.push({ x:el.x, y:top[i]-3, t:_fmtV(v, fmt), col:isLast?'#fff':'#4b5162',
        bg:isLast?'#1a1d29':null, size:isLast?11:10,
        prio: sel ? sel.get(i) : (isLast?100:50) }); });
  } else if (cfg.bars === 'each'){
    bars.forEach(({ds,m}) => { const sel = dense ? _pick(ds.data, 5) : null;
      m.data.forEach((el,i) => { const v = +ds.data[i] || 0; if (!v) return;
        if (sel && !sel.has(i)) return;
        cand.push({ x:el.x, y:el.y-3, t:_fmtV(v, fmt), col:'#7d8394', size:10,
          prio: sel ? sel.get(i) : (i===n-1?90:40) }); }); });
  }

  if (cfg.lines === 'all'){
    lines.forEach(({ds,m}) => { const sel = dense ? _pick(ds.data, 3) : null;
      m.data.forEach((el,i) => { const v = ds.data[i];
        if (v == null || v === 0) return;
        if (sel && !sel.has(i)) return;
        cand.push({ x:el.x, y:el.y-7, t:_fmtV(v, fmt), col:ds.borderColor||'#4b5162',
          bg:'rgba(255,255,255,.9)', size:10,
          prio: sel ? sel.get(i) : (i===n-1?95:50) }); }); });
  } else if (cfg.lines === 'edge'){
    lines.forEach(({ds,m}) => {
      const vals = ds.data.map(v => (v == null ? -1 : v));
      let mx = -1, mi = -1; vals.forEach((v,i) => { if (v > mx){ mx = v; mi = i; } });
      let li = -1; for (let i = vals.length-1; i >= 0; i--) if (vals[i] > 0){ li = i; break; }
      [[mi,mx,92],[li,vals[li],96]].forEach(([i,v,pr]) => { if (i < 0 || v <= 0 || !m.data[i]) return;
        cand.push({ x:m.data[i].x, y:m.data[i].y-6, t:_fmtV(v, fmt), col:'#fff',
          bg:ds.borderColor||'#333', size:10, prio:pr }); }); });
  }

  cand.sort((a,b) => b.prio - a.prio);
  const placed = [];
  const hit = r => placed.some(q => !(r.x2 < q.x1 || r.x1 > q.x2 || r.y2 < q.y1 || r.y1 > q.y2));
  const area = c.chartArea;
  for (const it of cand){
    ctx.font = `600 ${it.size}px system-ui,sans-serif`;
    const w = ctx.measureText(it.t).width, pad = it.bg ? 3 : 1;
    let y = it.y;
    const box = () => ({ x1:it.x-w/2-pad-2, x2:it.x+w/2+pad+2, y1:y-it.size-pad-2, y2:y+pad+1 });
    let r = box(), tries = 0;
    while (hit(r) && tries < 3){ y -= it.size + 4; r = box(); tries++; }
    if (hit(r) || r.y1 < area.top - 2) continue;
    placed.push(r);
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    if (it.bg){ ctx.fillStyle = it.bg;
      if (ctx.roundRect){ ctx.beginPath(); ctx.roundRect(it.x-w/2-pad, y-it.size-pad, w+pad*2, it.size+pad*2, 4); ctx.fill(); }
      else ctx.fillRect(it.x-w/2-pad, y-it.size-pad, w+pad*2, it.size+pad*2); }
    ctx.fillStyle = it.col; ctx.fillText(it.t, it.x, y); ctx.restore();
  }
}};

function setAxis(a){ AD_AXIS = a; vAd(); }
let AD_AXIS2 = null;

function campTable(){
  const {W, A, li, pi} = D;
  const norm = s => String(s||'').replace(/^\d{6}_/,'').toLowerCase();
  const agg = w => { const m = {}; (A.camp[w]||[]).forEach(r => {
      const k = r.m + '|' + r.cp; (m[k] = m[k] || {m:r.m, ty:r.ty, cp:r.cp, im:0, ck:0, co:0});
      m[k].im+=r.im; m[k].ck+=r.ck; m[k].co+=r.co; }); return m; };
  const cur = agg(W[li]), prv = agg(W[pi]);
  /* 상담 캠페인 → 광고 캠페인 1:1 배정
     ① 이름 완전일치 우선  ② 앞 6자리 날짜 뗀 뒤 일치  ③ 둘 다 없으면 미매칭
     후보가 여럿이면 광고비가 큰 쪽에 배정 (중복 계상 방지) */
  const assign = (adRows, t7) => {
    const out = {}, un = [];
    const byRaw = {}, byNorm = {};
    adRows.forEach(r => {
      (byRaw[r.cp] = byRaw[r.cp] || []).push(r);
      (byNorm[norm(r.cp)] = byNorm[norm(r.cp)] || []).push(r);
    });
    (t7 || []).forEach(([ch, cp, v]) => {
      /* 상담 캠페인에 자체 날짜(260828_)가 붙어 있으면 완전일치만 인정 —
         다른 날짜의 같은 캠페인에 잘못 붙는 것을 막는다 */
      const dated = /^\d{6}_/.test(cp);
      let cand = byRaw[cp] || (dated ? null : byNorm[norm(cp)]) || null;
      if (cand) cand = cand.filter(r => r.m === ch);   /* 같은 매체끼리만 배정 */
      if (!cand || !cand.length) { un.push([cp, v]); return; }
      const best = cand.slice().sort((a,b) => b.co - a.co)[0];
      const k = best.m + '|' + best.cp;
      out[k] = (out[k] || 0) + v;
    });
    return {out, un};
  };
  const adCur = Object.values(cur), adPrv = Object.values(prv);
  const AL = assign(adCur, SNAP.T7 && SNAP.T7.lw);
  const AP = assign(adPrv, SNAP.T7 && SNAP.T7.pw);
  const cvL = AL.out, cvP = AP.out;
  const rows = adCur
    .map(r => ({...r, cv: cvL[r.m+'|'+r.cp]||0, cvp: cvP[r.m+'|'+r.cp]||0}))
    .sort((a,b) => (b.cv - a.cv) || (b.co - a.co)).slice(0, 15);
  const un = AL.un;
  const unTot = un.reduce((s,[,v]) => s+v, 0);
  /* 광고비가 안 들어온 캠페인(디맨드젠 등)도 상담 건수는 보여 준다 */
  const unRows = un.filter(x => x[0] !== '(없음)').sort((a,b) => b[1] - a[1]).slice(0, 8);
  const dgN = unRows.filter(x => isDG(x[0])).length;
  const none = (SNAP.T7 && SNAP.T7.lw || []).filter(r => r[1] === '(없음)').reduce((s,r) => s + r[2], 0);
  const pill = m => `<span class="pill ${m==='네이버'?'p-n':m==='구글'?'p-g':'p-c'}">${m}</span>`;
  return `<table><thead><tr><th>매체</th><th>캠페인</th><th>업종</th><th>상담인입</th><th>CPA</th>
      <th>광고비</th><th>노출</th><th>클릭</th><th>CPC</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${pill(r.m)}</td><td>${r.cp}${dgTag(r.cp)}
        <span class="muted" style="font-size:10px">${r.ty||''}</span></td>
      <td style="text-align:left">${CMAP[r.cp]||'<span class="muted">미분류</span>'}</td>
      <td>${r.cv ? `<b>${r.cv}</b> ${dv(r.cv, r.cvp)}` : (r.cvp ? `<span class="muted">–</span> ${dv(0,r.cvp)}` : '<span class="muted">–</span>')}</td>
      <td>${r.cv ? nf(r.co/r.cv) : '<span class="muted">–</span>'}</td>
      <td>${z0(r.co)}</td><td>${z0(r.im)}</td><td>${z0(r.ck)}</td>
      <td>${r.ck?nf(r.co/r.ck):'<span class="muted">–</span>'}</td></tr>`).join('')}
    ${unRows.map(([cp,v]) => `<tr class="wold"><td><span class="muted">–</span></td>
      <td>${cp}${dgTag(cp)} <span class="muted" style="font-size:10px">광고비 미집계</span></td>
      <td style="text-align:left">${CMAP[cp]||'<span class="muted">미분류</span>'}</td>
      <td><b>${v}</b></td>
      <td colspan="5" style="text-align:left"><span class="muted">광고비가 시트에 안 들어와 CPA 계산 불가</span></td></tr>`).join('')}
    </tbody></table>
    <div class="note" style="margin-top:8px">
      ※ 상담인입은 <b>utm_campaign</b> 기준이라 광고 캠페인명과 붙였습니다
      (<code>260311_qrpass_A</code> ↔ <code>qrpass_A</code> 처럼 앞 날짜는 떼고 매칭).<br>
      ※ 캠페인이 안 붙은 상담인입 <b>${none}건</b>(utm_campaign 없음)은 위 표에 없습니다.
      ${dgN ? `<br>※ <b style="color:#7c3aed">디맨드젠</b>은 구글애즈 내보내기에 빠져 광고비가 시트에 없습니다. 상담 건수만 표시합니다.` : ''}
    </div>`;
}

/* ── 네이버 SA 키워드 ──
   ① 상담인입 탭 : 최근 3주 합계 · 전환 기여 순 (모수가 작아 기간을 길게 잡는다)
   ② 클릭 탭    : 마감 주차 1주 · 클릭 순 (집행 현황 점검용)            */
let KW_TAB = 'cv';
function setKwTab(t){ KW_TAB = t; vAd(); }

const _kwRows = wk => (D.KW[wk]||[])
  .filter(r => r.m === '네이버' && /search/i.test(r.ty||'') && r.kw && r.kw !== '(미기록)' && r.kw !== '-');

function kwBody(rows, mode, note){
  if (!rows.length) return '<div class="note">해당 기간 네이버 SA 키워드 데이터가 없습니다.</div>';
  const b = (on, v) => on ? `<b>${v}</b>` : v;
  const T = rows.reduce((a,r)=>({co:a.co+r.co, im:a.im+r.im, ck:a.ck+r.ck, cv:a.cv+r.cv}), {co:0,im:0,ck:0,cv:0});
  const cvOn = mode === 'cv', ckOn = mode === 'clk';
  return `<table><thead><tr><th>캠페인</th><th>키워드</th><th>노출</th><th${ckOn?' style="color:#6d28d9"':''}>클릭</th>
      <th>광고비</th><th${ckOn?' style="color:#6d28d9"':''}>CPC</th><th>CTR</th>
      <th${cvOn?' style="color:#6d28d9"':''}>CPA</th><th${cvOn?' style="color:#6d28d9"':''}>상담인입</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r.cp}</td><td style="text-align:left">${r.kw}</td>
      <td>${z0(r.im)}</td><td>${b(ckOn, z0(r.ck))}</td><td>${z0(r.co)}</td>
      <td>${b(ckOn, r.ck?nf(r.co/r.ck):'<span class="muted">–</span>')}</td>
      <td>${r.im?(r.ck/r.im*100).toFixed(2)+'%':'<span class="muted">–</span>'}</td>
      <td>${b(cvOn, r.cv?nf(r.co/r.cv):'<span class="muted">–</span>')}</td>
      <td>${b(cvOn, r.cv?nf(r.cv):'<span class="muted">–</span>')}</td></tr>`).join('')}
    <tr class="tot"><td colspan="2">상위 ${rows.length} 합계</td><td>${nf(T.im)}</td><td>${nf(T.ck)}</td>
      <td>${nf(T.co)}</td><td>${T.ck?nf(T.co/T.ck):'—'}</td>
      <td>${T.im?(T.ck/T.im*100).toFixed(2)+'%':'—'}</td>
      <td>${T.cv?nf(T.co/T.cv):'<span class="muted">–</span>'}</td>
      <td>${T.cv?nf(T.cv):'<span class="muted">–</span>'}</td></tr></tbody></table>${note}`;
}

function kwTable(){
  const {W, li} = D;
  const Q = SNAP.KWQ;
  const seg = `<div class="seg" style="margin:0 0 10px">
    <button class="${KW_TAB==='cv'?'on':''}" onclick="setKwTab('cv')">상담인입 순 <span class="muted">최근 12주</span></button>
    <button class="${KW_TAB==='clk'?'on':''}" onclick="setKwTab('clk')">클릭 순 <span class="muted">${md(W[li])}주</span></button></div>`;

  if (KW_TAB === 'cv'){
    if (!Q || !Q.rows) return seg + '<div class="note">분기 키워드 집계가 아직 없습니다.</div>';
    const rows = Q.rows.map(r => ({cp:r[0], kw:r[1], im:r[2], ck:r[3], co:r[4], cv:r[5]}));
    const tot = rows.reduce((s,r)=>s+r.cv,0);
    const per = `<div class="note" style="margin-top:8px">※ 기간 <b>${md(Q.from)}주 ~ ${md(Q.to)}주</b> 12주(한 분기) 합계입니다.
      키워드 단위 상담은 1주에 10건 안팎이라 줄을 세울 수 없어 분기로 묶었습니다 (이 기간 ${tot}건).<br>
      ※ 상담은 <b>utm_term</b>으로 붙입니다. 키워드 하나가 여러 캠페인에 걸려 있으면 캠페인을 묶어서 한 줄로 적습니다.
      <b>제로아이즈</b>처럼 브랜드명을 검색해 들어온 건은 광고가 새로 만든 수요가 아니라는 점을 감안해서 보세요.</div>`;
    return seg + kwBody(rows, 'cv', per);
  }
  const rows = _kwRows(W[li]).map(r=>({...r, cv:0})).sort((a,b)=>b.ck-a.ck).slice(0,20);
  const skipped = (D.KW[W[li]]||[]).filter(r => r.m === '네이버' && /search/i.test(r.ty||'') && (!r.kw || r.kw === '(미기록)' || r.kw === '-'));
  const sc = skipped.reduce((s,r)=>s+r.co,0), sk = skipped.reduce((s,r)=>s+r.ck,0);
  const per = `<div class="note" style="margin-top:8px">※ 기간 <b>${md(W[li])}주</b> 1주입니다 ·
    키워드 미기록(확장검색 등) <b>${nf(sc)}원 · 클릭 ${nf(sk)}</b>은 표에서 빠져 있습니다.</div>`;
  return seg + kwBody(rows, 'clk', per);
}

/* ── 3. 공홈 GA ── */
let GA_PAGE = null;
function pickGaPage(c){ GA_PAGE = (GA_PAGE === c ? null : c); vGa(); }
/* GA·광고·상담을 한 표에 — 주간회의 '동기간 비교' 포맷
   방문 대비 상담전환율까지 같이 낸다 (회의 표에 매주 들어가는 줄) */
function gaTrend3(li){
  const {W, G, C, A} = D, t = G.tot;
  const I = [li-2, li-1, li].filter(i => i >= 0);
  const clk = i => AD_CH.reduce((s,c) => s + (A.ch[c] ? (A.ch[c].clk[i]||0) : 0), 0);
  const rows = [
    ['GA 방문',            i => t.pv[i],                                  'n', false],
    ['광고 클릭',          i => clk(i),                                   'n', false],
    ['상담인입',           i => C.tot[i],                                 'n', true ],
    ['상담전환율',         i => t.pv[i] ? C.tot[i]/t.pv[i]*100 : null,    'p', true ],
    ['GA 이탈률',          i => t.pv[i] ? t.bw[i]/t.pv[i]*100 : null,     'p', false],
    ['GA 전환',            i => t.cv[i],                                  'n', false],
  ];
  const fmt = (v, k) => v == null ? '<span class="muted">–</span>'
    : k === 'p' ? v.toFixed(2) + '%' : nf(v);
  const diff = (c, p, k) => {
    if (c == null || p == null) return '<span class="muted">–</span>';
    const d = c - p;
    if (!d) return '<span class="neu">0</span>';
    const txt = k === 'p' ? Math.abs(d).toFixed(2) + '%p'
      : (p ? Math.abs(d/p*100).toFixed(1) + '%' : Math.abs(d));
    return `<span class="${d>0?'up':'dn'}">${d>0?'+':'−'}${txt}</span>`;
  };
  return `<table><thead><tr><th>지표</th>${I.map(i=>`<th>${md(W[i])}주</th>`).join('')}<th>증감</th></tr></thead><tbody>
    ${rows.map(([lb, f, k, bold]) => {
      const vs = I.map(f), c = vs[vs.length-1], p = vs[vs.length-2];
      return `<tr class="${bold?'tot':''}"><td>${lb}</td>
        ${vs.map((v,j)=>`<td>${j===vs.length-1?`<b>${fmt(v,k)}</b>`:fmt(v,k)}</td>`).join('')}
        <td>${diff(c,p,k)}</td></tr>`; }).join('')}
  </tbody></table>
  <div class="note" style="margin-top:6px">※ 상담전환율 = 상담인입 ÷ GA 방문. GA가 뒤처져 있으면 이 표도 GA가 있는 마지막 주 기준입니다.</div>`;
}

function vGa(){
  const {W, G} = D;
  /* GA는 적재가 늦어 지난주에 값이 없을 수 있음 → 데이터가 있는 마지막 주를 기준으로 */
  let li = D.li; while (li > 0 && !G.tot.pv[li]) li--;
  let pi = li - 1; while (pi > 0 && !G.tot.pv[pi]) pi--;
  const lag = li !== D.li, gN = li + 1;
  const L = W.slice(0, gN).map(md), ga = a => (a||[]).slice(0, gN);
  const t = G.tot, bounce = i => t.pv[i] ? t.bw[i]/t.pv[i]*100 : null, sess = i => t.pv[i] ? Math.floor(t.sw[i]/t.pv[i]) : null;
  const cards = Object.keys(G.cards)
    .filter(c => G.cards[c].pv[li] || G.cards[c].pv[pi])   /* 방문 0인 페이지는 카드 생략 */
    .sort((a,b) => G.cards[b].pv[li] - G.cards[a].pv[li]);
  const stale = D.F['GA'] && (parseInt(D.F['GA'].ago)||0) > 7;
  if (GA_PAGE && !cards.includes(GA_PAGE)) GA_PAGE = null;

  document.getElementById('body').innerHTML = `
  ${(stale||lag) ? `<div class="hint">⚠ <b>GA는 ${md(W[li])}주까지만 적재돼 있습니다${lag ? ` — 다른 탭(${md(W[D.li])}주)보다 ${D.li-li}주 뒤처짐` : ''}.</b> GA는 수동으로 붙여넣는 데이터라 최신이 아닙니다${D.F['GA'] ? ` (마지막 데이터 ${D.F['GA'].last}, ${D.F['GA'].ago})` : ''}. 아래 숫자는 <b>${md(W[li])}주 기준</b>이며 전주는 ${md(W[pi])}주입니다.</div>` : ''}
  <div class="kpis">
    <div class="kpi"><div class="lb">공홈 방문수</div><div class="v">${nf(t.pv[li])}</div>
      <div class="d">전주 ${nf(t.pv[pi])} ${dv(t.pv[li],t.pv[pi])}</div></div>
    <div class="kpi"><div class="lb">GA 전환</div><div class="v" style="color:#12b76a">${nf(t.cv[li])}건</div>
      <div class="d">전주 ${nf(t.cv[pi])}건 · CVR ${pct(t.cv[li],t.pv[li])}</div></div>
    <div class="kpi"><div class="lb">이탈률</div><div class="v" style="color:#f59e0b">${bounce(li)!=null?bounce(li).toFixed(1)+'%':'—'}</div>
      <div class="d">전주 ${bounce(pi)!=null?bounce(pi).toFixed(1)+'%':'—'} · 방문 가중평균</div></div>
    <div class="kpi"><div class="lb">평균 세션</div><div class="v">${sess(li)!=null?sess(li)+'초':'—'}</div>
      <div class="d">전주 ${sess(pi)!=null?sess(pi)+'초':'—'}</div></div>
    <div class="kpi"><div class="lb">최다 방문</div><div class="v" style="font-size:19px;color:#3b82f6">${cards[0]||'—'}</div>
      <div class="d">${nf(G.cards[cards[0]]?G.cards[cards[0]].pv[li]:0)}건 · 전체 ${pct(G.cards[cards[0]]?G.cards[cards[0]].pv[li]:0, t.pv[li])}</div></div>
  </div>

  <div class="card"><h3>동기간 비교 — 방문 · 광고 · 상담</h3>
    <div class="note">주간회의 GA 표와 같은 형식 · ${md(W[Math.max(0,li-2)])}주 → ${md(W[Math.max(0,li-1)])}주 → ${md(W[li])}주</div>
    <div class="tblwrap">${gaTrend3(li)}</div></div>

  <div class="card"><h3>공홈 방문 추이</h3><div class="note">전체 방문 · GA 전환 · ${md(W[li])}주까지</div>
    <div style="height:250px"><canvas id="g_tr"></canvas></div></div>

  <div class="card"><h3>페이지별 현황</h3>
    <div class="note">${md(W[li])}주 기준 · 괄호 없는 작은 숫자는 전주(${md(W[pi])}) 대비 · 이탈률은 낮을수록·체류시간은 길수록 초록 · <b>카드를 누르면 아래에 그 페이지 추이가 열립니다</b></div>
    <div class="gacards">${cards.map(c => { const g = G.cards[c];
      const rate = i => g.pv[i] ? g.bw[i]/g.pv[i]*100 : null;
      const ss = i => g.pv[i] ? Math.floor(g.sw[i]/g.pv[i]) : null;
      const b = rate(li), bp = rate(pi), s = ss(li), sp = ss(pi);
      const main = GA_MAIN.includes(c);
      /* 이탈률은 낮을수록 좋음 → 색 반전 */
      const dBounce = (b!=null && bp!=null) ? (b-bp) : null;
      const dSess = (s!=null && sp!=null) ? (s-sp) : null;
      const bad = (dd,inv) => dd==null||Math.abs(dd)<0.05 ? '<span class="neu dt">±0</span>'

/* ── 전월 리포트 (월간) ── */
/* 리포트 대상 달 = 스냅샷 기준 '지난달'. 10월이면 9월. 그 달 데이터가 아직 없으면 있는 마지막 달로 내려간다 */
function repMonth(){
  const ks = Object.keys(MON).sort();
  const s = (D.snapDate || new Date().toISOString().slice(0,10)).slice(0,7);
  const y = +s.slice(0,4), m = +s.slice(5);
  const want = m === 1 ? (y-1) + '-12' : y + '-' + String(m-1).padStart(2,'0');
  return MON[want] ? want : ks[ks.length-1];
}
/* 그 달이 다 채워졌는지 — 소스별 마지막 적재일이 월말에 못 미치면 구멍이 있는 것 */
function repGaps(cur){
  const y = +cur.slice(0,4), m = +cur.slice(5);
  const end = new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10);   /* 그 달 말일 */
  const out = [];
  [['상담인입','상담인입'], ['광고','광고비·클릭·노출'], ['GA','공홈 방문·이탈률·체류시간']].forEach(([k, lb]) => {
    const f = (D.F||{})[k]; if (!f || !f.last) return;
    if (f.last >= end) return;
    const miss = Math.round((new Date(end) - new Date(f.last)) / 86400000);
    out.push({ src:k, lb, last:f.last, miss, dead: f.last < cur + '-01' });
  });
  return { end, out };
}

  const GAP = repGaps(cur);

  const d1 = (a,b) => { const x=a-b; return b ? `<span class="${x>=0?'up':'dn'} dt">${x>=0?'+':'−'}${nf(Math.abs(x))} (${x>=0?'+':'−'}${Math.abs(x/b*100).toFixed(1)}%)</span>` : ''; };
  const dM = (a,b) => { const x=a-b; return b ? '<span class="'+(x>=0?'up':'dn')+' dt">'+(x>=0?'+':'−')+(Math.abs(x)/10000).toFixed(1)+'만 ('+(x>=0?'+':'−')+Math.abs(x/b*100).toFixed(1)+'%)</span>' : ''; };

/* 공통 헬퍼 */
const _g = (a,i) => (a && a[i] != null ? a[i] : 0);
const wkIdx12 = () => { const {W,li} = D; return W.map((_,i)=>i).slice(Math.max(0,li-11), li+1); };
const wkIdx10 = () => { const {W,li} = D; return W.map((_,i)=>i).slice(Math.max(0,li-9), li+1); };
/* 세 주 추이: 앞 두 주는 회색 보조, 이번 주만 진하게 */
const _mix = v => `<span class="old2">${v[0]}<span class="rt">→</span>${v[1]}</span><span class="rt">→</span><b>${v[2]}</b>`;
const _row = (label, cur, prv, pp, cls, indent, ha, o7) => {
  const d = cur - prv;
  const sub = v => v || '<span class="muted">–</span>';
  return `<tr class="${cls||''}"><td style="${indent?'padding-left:24px;color:#6b7280':''}">${indent?'└ ':''}${label}</td>
    <td class="old2">${z0(pp)}</td><td class="old2">${z0(prv)}</td><td><b>${z0(cur)}</b></td>
    <td>${d===0?'<span class="neu dt">0</span>':`<span class="${d>0?'up':'dn'} dt">${d>0?'+':'−'}${Math.abs(d)}</span>`}</td>
    <td style="white-space:nowrap">${sub(ha)}</td><td style="white-space:nowrap">${sub(o7)}</td></tr>`;
};

  const pc = (a,b) => b > 0 ? Math.round(a/b*100)+'%' : null;

  /* 채널 표와 같은 모양으로 — 세 주를 가로로, 비율 없이 숫자만 */
  const t3 = arr => _mix([qi,pi,li].map(i => arr[i]||0));

  const sumTbl = `<table><thead><tr><th>업종</th><th class="old2">${md(W[qi])}주</th><th class="old2">${md(W[pi])}주 (전주)</th><th>${md(W[li])}주</th>
      <th>증감</th><th>상담희망</th><th>0.7↑ 가망</th></tr></thead><tbody>
    ${names.map(b => { const e = BZW[b];
      return _row(b, e.t[li], e.t[pi], e.t[qi], '', false, t3(e.a), t3(e.o)); }).join('')}
    ${_row('전체', C.tot[li], C.tot[pi], C.tot[qi], 'tot', false, t3(C.ha), t3(C.o7))}
    </tbody></table>`;

  const wkTbl = (key, list, title) => `<table><thead><tr><th>업종</th>${T10.map((i,j)=>`<th${wcW(i)}>${md(W[i])}주</th>`).join('')}</tr></thead><tbody>
    ${list.map(b => `<tr><td>${b}</td>${T10.map((i,j)=>`<td${wcW(i)}>${z0(BZW[b][key][i])}</td>`).join('')}</tr>`).join('')}
    <tr class="tot"><td>전체</td>${T10.map((i,j)=>`<td${wcW(i)}>${z0(key==='t'?C.tot[i]:key==='a'?C.ha[i]:C.o7[i])}</td>`).join('')}</tr></tbody></table>`;

  /* 메인업종 채널 카드 */
  const bizCard = bz => { const e = (C.bzWk[bz]||{}); const cw = e[W[li]]||{t:0,o:0,y:0,a:0,ch:{}}, pw = e[W[pi]]||{t:0,o:0,y:0,a:0,ch:{}};
    const r = (lb, c, p, cls, ind) => { const d = c - p;
      return `<tr class="${cls||''}"><td style="${ind?'padding-left:20px;color:#6b7280':''}">${ind?'└ ':''}${lb}</td>
        <td>${z0(p)}</td><td><b>${z0(c)}</b></td>
        <td>${d===0?'<span class="neu">0</span>':`<span class="${d>0?'up':'dn'}">${d>0?'+':'−'}${Math.abs(d)}</span>`}</td></tr>`; };
    const ad = o => AD_CH.reduce((s,c)=>s+(o.ch[c]||0),0);
    const ct = o => CONT_CH.reduce((s,c)=>s+(o.ch[c]||0),0);
    return `<div class="card" style="margin:0"><h3>${bz}</h3>
      <table style="min-width:0"><thead><tr><th>채널</th><th>${md(W[pi])}</th><th>${md(W[li])}</th><th>증감</th></tr></thead><tbody>
      ${AD_CH.map(c => r(c, cw.ch[c]||0, pw.ch[c]||0)).join('')}
      ${r('광고 합계', ad(cw), ad(pw), 'grp')}
      ${r('자연유입', cw.ch['자연']||0, pw.ch['자연']||0)}
      ${r('콘텐츠', ct(cw), ct(pw))}
      ${r('기타', cw.ch['기타']||0, pw.ch['기타']||0)}
      ${r('전체 상담인입', cw.t, pw.t, 'tot')}
      ${r(`0.7이상 (${pc(pw.o,pw.t)}→${pc(cw.o,cw.t)})`, cw.o, pw.o, '', true)}
      ${r(`상담희망 (${pc(pw.a,pw.t)}→${pc(cw.a,cw.t)})`, cw.a, pw.a, '', true)}
      </tbody></table></div>`; };

  document.getElementById('wkbody').innerHTML = `
  <div class="card"><h3>전주 대비 업종별 요약</h3>
    <div class="note">${md(W[qi])}주 → ${md(W[pi])}주 → <b>${md(W[li])}주</b> · 진한 숫자가 이번 주, 회색은 앞 두 주 · 중복·테스트 제외</div>
    <div class="tblwrap">${sumTbl}</div></div>
  <div class="card"><h3>최근 12주 업종별 상담인입 추이 (스택)</h3>
    <div style="height:330px"><canvas id="b_stack"></canvas></div></div>
  <div class="card"><h3>주차별 상담인입 추이</h3><div class="note">업종별 · 최근 ${T10.length}주</div>
    <div class="tblwrap">${wkTbl('t', names.filter(b=>T10.some(i=>BZW[b].t[i])), '')}</div></div>
  <div class="card"><h3>주차별 상담희망 추이</h3><div class="note">업종별(주요 5개+전체) · 네+빠른 · 최근 ${T10.length}주</div>
    <div class="tblwrap">${wkTbl('a', BIZ5.filter(b=>BZW[b]), '')}</div></div>
  <div class="card"><h3>주차별 0.7↑ 가망 추이</h3><div class="note">업종별(주요 5개+전체) · 최근 ${T10.length}주</div>
    <div class="tblwrap">${wkTbl('o', BIZ5.filter(b=>BZW[b]), '')}</div></div>
  <div class="card"><h3>메인업종 채널별 추이</h3>
    <div class="note">${md(W[pi])}주 → ${md(W[li])}주 · 채널 × 0.7↑ × 상담희망</div>
    <div class="grid2">${bizCard('스카독서실')}${bizCard('탁구장')}</div></div>
  <div class="note">※ 인입=상담인입(중복=0·테스트 제외) · 채널=utm_source 원천 · 상담희망=네('네, 희망합니다')+빠른상담 ·
    0.7={0.7 / 0.7_CRM / 1.0_CRM / 1} · 비율=해당 업종 상담인입 대비.</div>`;

  const bl = Object.keys(BZW).filter(b => idx.some(i => BZW[b].t[i]));
  mk('b_stack', { type:'bar', data:{ labels:L, datasets: bl.map(b => ({
      label:b, data: idx.map(i=>BZW[b].t[i]), backgroundColor:BC[b]||'#ddd', borderRadius:2, stack:'s' })) },
    options: baseOpt(true, {}, {bars:'total'}), plugins:[LBL] });
}

/* ── 최근 14일 ── */
function wk14(){
  const {Y} = D, d = Y.d, m = d.length, last = m-1, prev = m-2;
  const dow = s => ['일','월','화','수','목','금','토'][sd(s).getUTCDay()];
  const off = (sd(d[last]).getUTCDay()+6)%7, wkStart = d[last]-off, done = off+1;
  const dm = Object.fromEntries(d.map((x,i)=>[x,i]));
  const at = (a,x) => (dm[x]===undefined ? 0 : (a[dm[x]]||0));
  const sumR = (a,b) => { let s=0; for (let x=a; x<=b; x++) s += at(Y.tot,x); return s; };
  const wtd = sumR(wkStart, d[last]);

  /* 이번주 예상치 — 최근 4주 "같은 요일까지 → 주 전체" 배수의 중앙값 */
  const rat = [];
  for (let k=1; k<=4; k++){
    const s0 = wkStart-7*k, part = sumR(s0, s0+off), full = sumR(s0, s0+6);
    if (part > 0) rat.push(full/part);
  }
  rat.sort((a,b)=>a-b);
  const med = rat.length ? (rat.length%2 ? rat[(rat.length-1)/2] : (rat[rat.length/2-1]+rat[rat.length/2])/2) : null;
  const est = med!=null ? Math.round(wtd*med) : null;
  const lo = rat.length ? Math.round(wtd*rat[0]) : null;
  const hi = rat.length ? Math.round(wtd*rat[rat.length-1]) : null;
  const lwFull = sumR(wkStart-7, wkStart-1);

  /* 유형별 (최근일 vs 전일) */
  const fms = Object.keys(Y.fm).sort((a,b)=>(Y.fm[b][last]||0)-(Y.fm[a][last]||0));

  const I14 = d.map((_,i)=>i).slice(-14);
  const dEtc  = i => ETC_MERGE.reduce((s,c)=>s+((Y.ch[c]||[])[i]||0),0);
  const dCont = i => CONT_CH.reduce((s,c)=>s+((Y.ch[c]||[])[i]||0),0);
  const chs = [...AD_CH,'자연'].filter(c=>Y.ch[c])
    .concat(I14.some(i=>dCont(i))?['콘텐츠']:[]).concat(I14.some(i=>dEtc(i))?['기타']:[]);

  /* 업종 — 14일 합계 상위 6개 + 나머지 기타 */
  const bsum = Object.keys(Y.bz).map(b=>[b, I14.reduce((s,i)=>s+(Y.bz[b][i]||0),0)])
    .filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const bTop = bsum.slice(0,6).map(([b])=>b).filter(b=>b!=='기타');
  const bRest = bsum.map(([b])=>b).filter(b=>!bTop.includes(b));
  const bAt = (b,i) => b==='기타' ? bRest.reduce((s,x)=>s+((Y.bz[x]||[])[i]||0),0) : ((Y.bz[b]||[])[i]||0);
  const bzs = bRest.length ? [...bTop,'기타'] : bTop;

  document.getElementById('wkbody').innerHTML = `
  <div class="hint">📌 <b>매일 갱신되는 건 상담인입뿐입니다.</b> 광고비·GA는 수동 적재라 며칠씩 비어 있을 수 있습니다.
    빈 값은 <b>0건이 아니라 "아직 안 들어옴"</b>입니다.</div>
  <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr))">
    <div class="kpi">
      <div class="lb">${md(d[last])}(${dow(d[last])}) 상담인입 <span class="muted">최근일</span></div>
      <div class="v" style="color:#6d28d9">${nf(Y.tot[last])}건</div>
      <div class="d">전일 ${nf(Y.tot[prev])}건 ${dv(Y.tot[last],Y.tot[prev])}</div>
      <div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px">
        ${fms.map(f => { const v = Y.fm[f][last]||0, p = Y.fm[f][prev]||0;
          return `<div class="krow"><span>${f}</span><b>${z0(v)}${(v||p)?dv(v,p):''}</b></div>`; }).join('')}
      </div></div>
    <div class="kpi">
      <div class="lb">${done>=7?'이번주 실적 <span class="muted">월~일 마감</span>':'이번주 예상 <span class="muted">월~일 마감 시</span>'}</div>
      <div class="v">${done>=7?nf(wtd)+'건':(est!=null?nf(est)+'건':'—')}</div>
      <div class="d">지난주 ${nf(lwFull)}건 ${dv(done>=7?wtd:est, lwFull)}${done>=7?'':` · 예상범위 ${lo}~${hi}건`}</div>
      <div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px">
        <div class="krow"><span>${done>=7?'주간 합계 (월~일)':'현재 누적 (월~'+dow(d[last])+' '+done+'일)'}</span><b>${nf(wtd)}건</b></div>
        ${done>=7?'':`<div class="krow"><span>남은 기간</span><b>${7-done}일</b></div>
        <div class="krow"><span>최근 4주 요일패턴 배수</span><b>×${med!=null?med.toFixed(2):'—'}</b></div>`}
        ${done>=7?`<div class="krow"><span>일평균</span><b>${(wtd/7).toFixed(1)}건</b></div>` : ''}
      </div>
      ${done<=3?`<div class="neu" style="font-size:10px;margin-top:6px;color:#f59e0b">※ 주 초반이라 예상치 변동이 큽니다</div>`:''}
    </div>
  </div>
  <div class="card"><h3>최근 14일 상담인입 — 채널별</h3><div class="note">막대 누적 · 숫자는 그날 합계</div>
    <div style="height:280px"><canvas id="d_ch"></canvas></div></div>
  <div class="card"><h3>최근 14일 상담인입 — 업종별</h3><div class="note">상위 ${bTop.length}개 업종 · 나머지는 기타로 묶음</div>
    <div style="height:280px"><canvas id="d_bz"></canvas></div></div>
  <div class="card"><h3>최근 14일 상세</h3><div class="note">채널별 · 업종은 위 그래프에 마우스를 올리면 나옵니다</div>
    <div class="tblwrap"><table><thead><tr><th>날짜</th><th>요일</th><th>전체</th>
      ${chs.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
      ${I14.slice().reverse().map(i=>`<tr><td>${md(d[i])}</td><td style="text-align:left">${dow(d[i])}</td>
        <td><b>${nf(Y.tot[i])}</b></td>
        ${chs.map(c=>`<td>${z0(c==='기타'?dEtc(i):c==='콘텐츠'?dCont(i):(Y.ch[c]||[])[i])}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;

  mk('d_ch', { type:'bar', data:{ labels:I14.map(i=>md(d[i])), datasets: chs.map(c => ({
      label:c, data:I14.map(i=> c==='기타'?dEtc(i):c==='콘텐츠'?dCont(i):((Y.ch[c]||[])[i]||0)), backgroundColor:CC[c]||'#ddd', borderRadius:2 })) },
    options: baseOpt(true, {}, {bars:'total'}), plugins:[LBL] });
  mk('d_bz', { type:'bar', data:{ labels:I14.map(i=>md(d[i])), datasets: bzs.map(b => ({
      label:b, data:I14.map(i=>bAt(b,i)), backgroundColor:BC[b]||'#cbd5e1', borderRadius:2 })) },
    options: baseOpt(true, {}, {bars:'total'}), plugins:[LBL] });
}

/* ═══════════════════════════════════════════════════════════
   부팅
   ═══════════════════════════════════════════════════════════ */
(() => {
  const S = SNAP;
  CMAP = S.CMAP || {};
  D.W = S.W; D.n = S.W.length;
  D.C = S.C; D.A = S.A; D.G = S.G; D.Y = S.Y; D.F = S.F;
  // 캠페인/키워드 튜플 → 객체
  const cm = {};
  for (const w in S.A.camp) cm[w] = S.A.camp[w].map(r => ({m:r[0], ty:r[1], cp:r[2], im:r[3], ck:r[4], co:r[5]}));
  D.A.camp = cm;
  D.KW = {};
  for (const w in S.KW) D.KW[w] = S.KW[w].map(r => ({m:'네이버', ty:'search', cp:r[0], kw:r[1], im:r[2], ck:r[3], co:r[4]}));
  // 광고인입 / 자연
  const z = () => Array(D.n).fill(0);

  /* 채널은 원본 그대로 쓴다. 공식블로그·네이버카페·체험단은 CONT_CH(콘텐츠)로 묶어
     표·차트에서만 한 줄로 보여 준다. 네이버에 합치지 않는다. */
  D.chOrg = {};
  ORG_CH.forEach(c => { if (D.C.ch[c]) D.chOrg[c] = D.C.ch[c].slice(); });

  D.adCv = z();
  AD_CH.forEach(c => (D.C.ch[c] || z()).forEach((v,i) => D.adCv[i] += v));
  D.natCv = (D.C.ch['자연'] || z()).slice();
  D.li = (S.LI != null ? S.LI : D.n - 2); D.pi = D.li - 1; D.cur = (D.li < D.n - 1 ? D.n - 1 : D.li);
  D.snapDate = S.SNAP;
  render();
})();
</script>
</body>
